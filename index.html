<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="이음(EEUM) — 마실고래버스와 시내버스를 하나의 경로로 이어주는 울주군 이동 서비스">
<meta name="theme-color" content="#0b2b45">
<meta name="format-detection" content="telephone=no">
<title>이음 (EEUM) — 마을에서 도시까지, 끊기지 않는 길</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
</head>
<body>
<div class="app" id="app">

  <!-- ══ 헤더 ══════════════════════════════════════ -->
  <header class="header">
    <div class="header-top">
      <div>
        <div class="logo"><span class="whale">🐋</span> 이음 <span style="font-size:.62em;opacity:.7;font-weight:600">EEUM</span></div>
        <div class="tagline">마실고래버스와 시내버스를 하나의 길로</div>
      </div>
    </div>
    <div class="badges" id="badges">
      <span class="badge off" id="badge-loc"><span class="dot"></span> 위치 확인 전</span>
      <span class="badge off" id="badge-ai"><span class="dot"></span> AI 연결 확인 중</span>
      <span class="badge off" id="badge-data"><span class="dot"></span> 스팟 데이터</span>
    </div>
  </header>

  <!-- ══ 모드 전환 ═════════════════════════════════ -->
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-normal" role="tab" aria-selected="true" aria-controls="screen-normal">
      🗺️ 일반모드
    </button>
    <button class="tab" id="tab-easy" role="tab" aria-selected="false" aria-controls="screen-easy">
      🗣️ 쉬운모드
    </button>
  </div>

  <!-- ══ 일반모드 ══════════════════════════════════ -->
  <main class="screen active" id="screen-normal" role="tabpanel" aria-labelledby="tab-normal">

    <!-- 1. 출발지 -->
    <section class="card">
      <h2 class="card-title">
        <span>📍 어디서 출발하시나요?</span>
        <span class="tag tag-logic">일반 로직</span>
      </h2>

      <button class="btn btn-teal" id="btn-locate">
        <span id="locate-label">현재 위치 사용하기</span>
      </button>

      <div id="locate-result"></div>

      <div class="field">
        <label class="label" for="sel-manual">또는 마을을 직접 고르기</label>
        <select class="select" id="sel-manual">
          <option value="">— 마을 선택 —</option>
        </select>
      </div>
    </section>

    <!-- 2. 목적지 -->
    <section class="card">
      <h2 class="card-title">
        <span>🎯 어디로 가시나요?</span>
        <span class="tag tag-logic">일반 로직</span>
      </h2>
      <select class="select" id="sel-dest">
        <option value="">— 목적지 선택 —</option>
      </select>
      <button class="btn btn-primary" id="btn-route" style="margin-top:12px" disabled>
        경로 찾기
      </button>
    </section>

    <!-- 3. 결과 -->
    <div id="results"></div>
  </main>

  <!-- ══ 쉬운모드 ══════════════════════════════════ -->
  <main class="screen" id="screen-easy" role="tabpanel" aria-labelledby="tab-easy">

    <section class="card" style="margin-top:12px">
      <h2 class="card-title">
        <span>🗣️ 말로 안내받기</span>
        <span class="tag tag-ai">AI</span>
      </h2>
      <p class="muted" style="margin:0">
        버튼을 누르고 <b>“병원 가고 싶어요”</b> 처럼 편하게 말씀하시면 됩니다.
        글자를 읽기 어려우시면 이음이 소리로 읽어드립니다.
      </p>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="btn-tts" aria-pressed="true">🔊 읽어주기 켜짐</button>
        <button class="btn btn-ghost btn-sm" id="btn-reset-chat">↺ 처음부터</button>
      </div>
    </section>

    <div class="chat" id="chat" aria-live="polite"></div>

    <div id="easy-result"></div>

    <div class="mic-area">
      <button class="mic" id="btn-mic" aria-label="말하기">🎙️</button>
      <div class="mic-hint" id="mic-hint">버튼을 누르고 말씀해주세요</div>
      <div class="text-input-row">
        <input class="input" id="text-input" placeholder="또는 여기에 입력하세요" autocomplete="off">
        <button class="btn btn-primary" id="btn-send">보내기</button>
      </div>
    </div>
  </main>

  <!-- ══ 푸터 ══════════════════════════════════════ -->
  <footer class="footer">
    <div class="legend">
      <span class="tag tag-ai">AI</span>
      <span class="tag tag-logic">일반 로직</span>
    </div>
    이음(EEUM) 프로토타입 · 울주군 마실고래버스 연계 이동 서비스<br>
    AI는 <b>지연 원인 설명</b>과 <b>쉬운모드 대화</b>에만 쓰이고, 경로·거리·시간 계산은 전부 일반 로직입니다.
  </footer>

</div>

<!--
  지도: 카카오맵 JavaScript API.
  ⚠️ 앱 키는 카카오 디벨로퍼스 콘솔에서 이 사이트의 실제 도메인이
  플랫폼(Web)에 등록되어 있어야 동작합니다. file:// 에서는 동작하지 않습니다.
  autoload=false 로 받고 app.js가 준비될 때 kakao.maps.load()로 초기화합니다
  (로딩 실패해도 app.js가 typeof kakao 체크로 안전하게 폴백합니다).
-->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=871b187aa14ea8cb5629b0c1afa82120&autoload=false"></script>

<!-- 순서 중요: kakao maps → config → data → geo → route → drt → ai → voice → app -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/route.js"></script>
<script src="js/drt.js"></script>
<script src="js/ai.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
